[project]
name = "team-ai-agent-code"
version = "0.1.0"
description = "팀 AI 에이전트 실전 실습 예제 및 대시보드 저장소"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "mcp>=2.0.0,<3",
]

[project.scripts]
team-work = "team_work.cli:main"

[project.optional-dependencies]
transcription = ["faster-whisper>=1.0.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "pillow>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/team_work"]

[tool.hatch.build.targets.wheel.force-include]
"src/app" = "src/app"
"src/mcp" = "src/mcp"
"llm.py" = "llm.py"
"wiki.py" = "wiki.py"
"examples" = "examples"
"book-exercises.yaml" = "book-exercises.yaml"
"legacy/ch02/wiki-starter/skills/wiki-sync" = "legacy/ch02/wiki-starter/skills/wiki-sync"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
